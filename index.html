<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182b4b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AEIOS">
<link rel="stylesheet" href="install.css">
<script src="install.js" data-name="AEIOS" data-ns="aeios"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<title>AEIOS Today · compare versions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#182b4b;font-family:Manrope,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #9cc3ff;outline-offset:2px}
:root{--ai-accent:#265CDA}
/* demo chrome: navy, clearly not part of the app being previewed */
.top{flex:none;background:linear-gradient(115deg,#141f36,#22385c);color:#fff;padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));display:grid;grid-template-columns:1fr auto;grid-template-areas:"tabs open" "pv pv";column-gap:8px}
.tabs{grid-area:tabs;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:44px;padding:0 14px;border-radius:12px;color:#c9d7e8;font-size:16px;font-weight:750;white-space:nowrap;scroll-snap-align:start}
.tabs button[aria-selected=true]{background:#fff;color:#182b4b}
.tabs button[hidden]{display:none}
.open{grid-area:open;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);text-decoration:none}
/* Preview time bar */
.pv{grid-area:pv;margin-top:8px;padding:8px 0 0;border-top:1px dashed rgba(201,215,232,.35);min-width:0}
.pv__head{display:flex;align-items:center;gap:8px;min-height:44px;min-width:0}
.pv__lbl{flex:none;padding:3px 8px;border-radius:6px;background:#f2c879;color:#182b4b;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.clock{flex:none;font-size:22px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;line-height:1.1}
.blk{font-size:15px;font-weight:650;color:#c9d7e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.info{font-size:14px;color:#a9bcd3;white-space:nowrap;flex:none}
.top.has-inst .info{display:none}
.inst{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px 0 10px;border-radius:12px;background:#fff;color:#182b4b;font-size:15px;font-weight:800;white-space:nowrap}
.inst[hidden]{display:none}
.inst:active{transform:scale(.97)}
.inst.hi{box-shadow:0 0 0 3px rgba(156,195,255,.65)}
.pv__row{display:flex;align-items:center;gap:6px;margin-top:6px}
.arrow{flex:none;width:44px;height:52px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.10);color:#fff}
.arrow:disabled{opacity:.35;cursor:default}
.arrow:not(:disabled):active{background:rgba(255,255,255,.22)}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center;min-width:76px;height:52px;padding:0 12px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
 background:rgba(255,255,255,.10);color:#dbe5f2;border:1.5px solid rgba(255,255,255,.14);line-height:1.15}
.chip b{font-size:15px;font-weight:800;white-space:nowrap}
.chip span{font-size:13px;font-weight:650;color:#a9bcd3;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip[aria-checked=true]{background:#fff;color:#182b4b;border-color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.chip[aria-checked=true] span{color:#3b5378}
.chip--now b::before{content:"";display:inline-block;width:7px;height:7px;margin:0 5px 2px 0;border-radius:50%;background:#5fcdb2;vertical-align:middle}
.chip:active{transform:scale(.97)}
.stage{flex:1;position:relative;background:#f2f3f7}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#f2f3f7}
.stage iframe.on{display:block}
@media (min-width:900px){
 .top{padding-left:20px;padding-right:20px}
 .tabs{mask-image:none}
 .pv{display:flex;align-items:center;gap:16px}
 .pv__head{flex:none;max-width:46%}
 .pv__row{flex:1;margin-top:0;min-width:0}
}
@media (prefers-reduced-motion:reduce){.chip:active,.inst:active{transform:none}}
</style>
</head>
<body>
<div class="top">
  <div class="tabs" role="tablist" aria-label="Version" id="tabs"></div>
  <a class="open" id="open" href="#" target="_blank" rel="noopener" aria-label="Open this version in a new tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
  <div class="pv" id="pv">
    <div class="pv__head"><span class="pv__lbl" id="pvLbl">Preview time</span><span class="clock" id="clock"></span><span class="blk" id="blk"></span><span class="info" id="info"></span><button type="button" class="inst" id="inst" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Install app</button></div>
    <div class="pv__row">
      <button type="button" class="arrow" id="prev" aria-label="Earlier time"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="chips" id="chips" role="radiogroup" aria-labelledby="pvLbl"></div>
      <button type="button" class="arrow" id="next" aria-label="Later time"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</div>
<div class="stage" id="stage"></div>
<script>
(function(){
var MIN=360,MAX=1350,STEP=5;
/* Maya's Thursday, from the showcase demo data (aeios2027.netlify.app) */
var DAY=[[405,425,'Wake up & wash'],[425,460,'Breakfast & get ready'],[465,495,'Travel to school'],
 [495,520,'Advisory'],[520,575,'Mathematics'],[575,630,'English'],[630,685,'Science'],[685,730,'Lunch & recess'],[730,785,'Social studies'],[785,850,'Studio & thinking skills'],[850,870,'Pack up'],
 [870,900,'Travel home'],[900,920,'Snack & decompress'],[930,950,'Review math corrections'],[960,985,'Piano practice'],
 [1095,1125,'Dinner'],[1150,1170,'Read a chapter'],[1230,1260,'Get ready for tomorrow'],[1260,1290,'Reading & quiet time'],[1290,1305,'Lights out']];
/* Preview moments: one tap each, no dragging. "Now" = the real clock (kept inside 6:00 AM to 10:30 PM). */
var MOMENTS=[{id:'now',label:'Now'},{id:'morning',label:'Morning',m:435},{id:'school',label:'School',m:600},{id:'lunch',label:'Lunch',m:690},
 {id:'afterschool',label:'After school',m:910},{id:'homework',label:'Homework',m:945},{id:'dinner',label:'Dinner',m:1110},
 {id:'evening',label:'Evening',m:1230},{id:'bedtime',label:'Bedtime',m:1290}];
var TABS=[
 {id:'mine',label:'Mine',src:'mine/',kind:'reload',info:'Copy of the live site',title:'Mine: copy of the live student Today page'},
 {id:'james',label:'James',src:'james/',kind:'reload',info:'No clock \u00b7 his markers moved',title:'James: Day View mockup'},
 {id:'a',label:'A \u00b7 Calm',src:'new/',kind:'msg',info:'',title:'A: Calm'},
 {id:'b',label:'B \u00b7 Focus',src:'variants/b-focus/index.html',kind:'msg',info:'Concept',title:'B: Focus',optional:1},
 {id:'c',label:'C \u00b7 Timeline',src:'variants/c-timeline/index.html',kind:'msg',info:'Concept',title:'C: Timeline',optional:1},
 {id:'d',label:'D \u00b7 Chat',src:'variants/d-chat/index.html',kind:'msg',info:'Concept',title:'D: Chat',optional:1}];
var byId={};TABS.forEach(function(t){byId[t.id]=t;});
var $=function(i){return document.getElementById(i);};
var frames={},tab='a',T=945,sel='homework';
function clk(m){var h=Math.floor(m/60),mm=m%60;return (h%12||12)+':'+(mm<10?'0':'')+mm+' '+(h>=12?'PM':'AM');}
function short(m){var h=Math.floor(m/60),mm=m%60;return (h%12||12)+':'+(mm<10?'0':'')+mm;}
function hhmm(m){var h=Math.floor(m/60),mm=m%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}
function compact(m){return String(Math.floor(m/60)*100+m%60).padStart(4,'0');}
function blockAt(m){for(var i=0;i<DAY.length;i++)if(m>=DAY[i][0]&&m<DAY[i][1])return DAY[i];return null;}
function nowMin(){var d=new Date(),m=d.getHours()*60+d.getMinutes();return Math.max(MIN,Math.min(MAX,Math.round(m/STEP)*STEP));}
function mOf(x){return x.id==='now'?nowMin():x.m;}
function url(t){var d=byId[t];return d.kind==='reload'?d.src+'?t='+compact(T):(t==='a'?d.src+'?t='+compact(T):d.src+'#t='+hhmm(T));}
/* tabs */
TABS.forEach(function(t){var b=document.createElement('button');b.setAttribute('role','tab');b.id='t-'+t.id;b.dataset.tab=t.id;b.textContent=t.label;if(t.optional)b.hidden=true;$('tabs').appendChild(b);
 if(t.optional)fetch(t.src,{method:'HEAD',cache:'no-store'}).then(function(r){if(r.ok){b.hidden=false;if(t.id===tab)b.scrollIntoView({block:'nearest',inline:'center'});}}).catch(function(){});});
/* time chips (radiogroup, roving tabindex) */
var chipsEl=$('chips');
MOMENTS.forEach(function(x){var b=document.createElement('button');b.type='button';b.className='chip'+(x.id==='now'?' chip--now':'');b.id='c-'+x.id;b.dataset.id=x.id;
 b.setAttribute('role','radio');b.innerHTML='<b>'+x.label+'</b><span></span>';chipsEl.appendChild(b);});
function chipTimes(){MOMENTS.forEach(function(x){var b=$('c-'+x.id),m=mOf(x);b.querySelector('span').textContent=short(m);b.setAttribute('aria-label',x.label+', '+clk(m));});}
function idx(id){for(var i=0;i<MOMENTS.length;i++)if(MOMENTS[i].id===id)return i;return -1;}
function centerChip(b,smooth){var r=chipsEl.getBoundingClientRect(),c=b.getBoundingClientRect();
 var left=chipsEl.scrollLeft+(c.left-r.left)-(r.width-c.width)/2;chipsEl.scrollTo({left:Math.max(0,left),behavior:smooth?'smooth':'auto'});}
function post(t){var f=frames[t];if(!f||!f.contentWindow)return;try{f.contentWindow.postMessage({type:'demoTime',t:hhmm(T)},location.origin==='null'?'*':location.origin);}catch(e){}}
function loadFrame(t){var f=frames[t],u=url(t);if(byId[t].kind==='reload'){if(f.getAttribute('src')!==u)f.setAttribute('src',u);}else if(!f.getAttribute('src'))f.setAttribute('src',u);else post(t);}
function paint(){
 $('clock').textContent=clk(T);var b=blockAt(T);$('blk').textContent=b?b[2]:(T<405||T>=1305?'Asleep':'Free time');
 var i=idx(sel);
 [].forEach.call(chipsEl.children,function(c,k){var on=c.dataset.id===sel;c.setAttribute('aria-checked',on);c.tabIndex=(on||(i<0&&k===0))?0:-1;});
 $('prev').disabled=i<=0;$('next').disabled=i<0?false:i>=MOMENTS.length-1;
 $('info').textContent=byId[tab].info;$('open').href=url(tab);
 var h='#'+tab+'/t='+hhmm(T);if(location.hash!==h)history.replaceState(null,'',h);
}
function setT(m){m=Math.max(MIN,Math.min(MAX,Math.round(m/STEP)*STEP));T=m;paint();
 for(var k in frames)if(byId[k].kind==='msg')post(k);
 try{localStorage.setItem('aeios-compare-t',T);}catch(e){}
 if(byId[tab].kind==='reload')loadFrame(tab);}
function pick(id,focus){var i=idx(id);if(i<0)return;sel=id;chipTimes();setT(mOf(MOMENTS[i]));var b=$('c-'+id);centerChip(b,true);if(focus)b.focus({preventScroll:true});}
chipsEl.addEventListener('click',function(e){var b=e.target.closest('.chip');if(b)pick(b.dataset.id,false);});
chipsEl.addEventListener('keydown',function(e){var i=idx(sel),n=MOMENTS.length,k=e.key,j=null;
 if(k==='ArrowRight'||k==='ArrowDown')j=i<0?0:(i+1)%n;else if(k==='ArrowLeft'||k==='ArrowUp')j=i<0?n-1:(i-1+n)%n;else if(k==='Home')j=0;else if(k==='End')j=n-1;
 if(j!=null){e.preventDefault();pick(MOMENTS[j].id,true);}});
function step(d){var i=idx(sel);
 if(i<0){/* custom time from a link: go to the nearest moment in that direction */var best=null;
  MOMENTS.forEach(function(x){if(x.id==='now')return;if(d>0?x.m>T:x.m<T){if(!best||(d>0?x.m<best.m:x.m>best.m))best=x;}});
  if(best)pick(best.id);return;}
 var j=Math.max(0,Math.min(MOMENTS.length-1,i+d));if(j!==i)pick(MOMENTS[j].id);}
$('prev').addEventListener('click',function(){step(-1);});
$('next').addEventListener('click',function(){step(1);});
function show(t){
 if(!byId[t])t='a';tab=t;
 if(!frames[t]){var f=document.createElement('iframe');f.title=byId[t].title;f.addEventListener('load',function(){if(byId[t].kind==='msg')post(t);});$('stage').appendChild(f);frames[t]=f;}
 loadFrame(t);
 for(var k in frames)frames[k].classList.toggle('on',k===t);
 [].forEach.call(document.querySelectorAll('.tabs button'),function(b){var on=b.dataset.tab===t;b.setAttribute('aria-selected',on);if(on&&b.scrollIntoView)b.scrollIntoView({block:'nearest',inline:'nearest'});});
 paint();
}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.tab);});
setInterval(function(){chipTimes();if(sel==='now'){var m=nowMin();if(m!==T)setT(m);}},60000);
/* initial state: hash > saved > Homework 3:45 PM. Old links (#a/after, #a/t=10:30) keep working. */
var m=/^#([a-z]+)(?:\/(?:t=)?(\d{1,2}):?(\d{2}))?/.exec(location.hash||''),named={before:435,school:600,after:945,night:1230};
try{var sv=+localStorage.getItem('aeios-compare-t');if(sv>=MIN&&sv<=MAX)T=sv;}catch(e){}
var nm=/\/(before|school|after|night)$/.exec(location.hash||'');
if(m&&m[2])T=Math.max(MIN,Math.min(MAX,+m[2]*60+(+m[3])));else if(nm)T=named[nm[1]];
sel='';MOMENTS.forEach(function(x){if(!sel&&x.id!=='now'&&x.m===T)sel=x.id;});
var t0=m?m[1]:'a';if(t0==='new')t0='a';
chipTimes();show(t0);
if(sel)centerChip($('c-'+sel),false);
/* Install app: install.js picks Chrome's one-tap prompt, a hand-off to Chrome from in-app browsers, or 2 steps */
var AI=window.AppInstall,ib=$('inst');
function instUI(){var v=!!(AI&&AI.visible());ib.hidden=!v;document.querySelector('.top').classList.toggle('has-inst',v);ib.classList.toggle('hi',!!(AI&&AI.handedOff&&AI.mode()==='prompt'));}
if(AI){AI.onChange(instUI);ib.addEventListener('click',function(){AI.install();});}
instUI();
if('serviceWorker' in navigator&&window.isSecureContext)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});});
})();
</script>
</body>
</html>
