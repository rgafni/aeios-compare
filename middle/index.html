<!doctype html>
<html lang="en" class="ph-afternoon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<meta name="theme-color" content="#f4f4f5">
<title>AEIOS · Today · G (Middle)</title>
<link rel="stylesheet" href="../shared/mature.css">
<style>
/* AEIOS · Today · Variant G "Middle": the kid builds the plan; the coach reviews and asks. Fictional sample data only. */
.hd{margin:8px 0 12px}
.hd h1{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.hd p{font-size:14px;color:var(--muted);margin-top:3px}
.hd p b{color:var(--ink2);font-weight:600}
.plan{overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ph .lbl{font-size:13px;color:var(--muted)}
.ph .end{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph .end b{color:var(--ink);font-weight:650}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:8px;height:32px;overflow:hidden;font-variant-numeric:tabular-nums}
.stp button{width:30px;height:100%;display:grid;place-items:center;color:var(--muted)}
.stp button:hover{background:var(--card2);color:var(--ink)}
.stp span{min-width:44px;text-align:center;font-size:13.5px;font-weight:650}
.rows{list-style:none}
.row{display:grid;grid-template-columns:30px 1fr auto 28px;align-items:center;gap:8px;padding:8px 12px 8px 6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.mv{display:flex;flex-direction:column}
.mv button{width:30px;height:20px;display:grid;place-items:center;color:var(--faint);border-radius:5px}
.mv button:hover:not(:disabled){color:var(--ink);background:var(--card2)}
.mv button:disabled{opacity:.25;cursor:default}
.rt{min-width:0}
.rt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt>span{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rt span .ok{color:var(--acc-text);font-weight:600}
.row.done .rt b{text-decoration:line-through;color:var(--muted)}
.ck{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent}
.ck svg{width:15px;height:15px}
.row.done .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.row.flash{animation:fl .6s ease}
@keyframes fl{30%{background:var(--acc-wash)}}
.rv{grid-column:2 / -1;display:flex;align-items:flex-start;gap:7px;margin-top:4px;padding:7px 9px;border-radius:8px;background:var(--acc-wash);font-size:13px;line-height:1.35}
.rv .mark{width:16px;height:16px;border-radius:5px;margin-top:1px}
.rv p{flex:1;color:var(--ink2)}
.rv .acts{display:flex;gap:6px;margin-top:5px}
.rv .btn.sm{min-height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.rv.closed{background:transparent;padding:2px 0 0;color:var(--muted);font-size:12.5px}
.rv.closed .mark{opacity:.6}
.add{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card2)}
.add input{flex:1;min-width:0;height:38px;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:0 10px;font-size:16px}
.add select{height:38px;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:0 6px;font:inherit;font-size:14px;color:inherit}
.pf{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.pf .lbl{font-size:13.5px;font-weight:550}
.pf .sub{font-size:12.5px;color:var(--muted)}
.sw{margin-left:auto;width:42px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked=true]{background:var(--acc)}
.sw[aria-checked=true]::after{transform:translateX(16px)}
.ci .r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);min-height:48px}
.ci .r:last-child{border-bottom:0}
.ci .r b{font-size:14.5px;font-weight:550}
.ci .r span{font-size:12.5px;color:var(--muted);margin-left:6px}
.ci .r.off b{color:var(--muted)}
.sk{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.sk div{padding:12px}
.sk div+div{border-left:1px solid var(--line)}
.sk b{display:block;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.sk .lv{display:flex;align-items:baseline;gap:4px;margin:2px 0 7px;font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sk .lv small{font-size:12px;font-weight:600;color:var(--acc-text)}
.seg10{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.seg10 i{height:5px;border-radius:2px;background:var(--line)}
.seg10 i.on{background:var(--acc)}
.cr{display:flex;align-items:center;gap:10px;padding:10px 12px}
.cr .mark{width:30px;height:30px;border-radius:8px}
.cr div{flex:1;min-width:0}
.cr b{display:block;font-size:14px;font-weight:600}
.cr span{display:block;font-size:12.5px;color:var(--muted)}
.cr .btn{min-height:36px}
.rf textarea{display:block;width:100%;min-height:96px;border:0;resize:vertical;background:transparent;padding:12px;font-size:16px;line-height:1.4;color:var(--ink)}
.rf textarea:focus{outline:none}
.rf:focus-within{border-color:var(--acc)}
.rf .bt{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.rf .bt span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rf .bt .btn{margin-left:auto}
.mine{padding:12px;font-size:15px;line-height:1.4;white-space:pre-wrap;color:var(--ink)}
.mine small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.reply{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:12px}
.reply .mark{width:26px;height:26px;border-radius:7px}
.reply p{font-size:14.5px;line-height:1.4;color:var(--ink2)}
.reply .acts{display:flex;gap:6px;margin-top:8px}
.ed{margin-left:auto;font-size:12.5px;color:var(--muted)}
.row.ev{grid-template-columns:1fr 28px;padding-left:12px}
</style>
</head>
<body class="ph-afternoon">
<main class="wrap">
 <div class="pv" id="pv" role="radiogroup" aria-labelledby="pvL"><span id="pvL">Preview</span><div class="seg" id="seg">
  <button type="button" role="radio" data-p="morning">Morning</button><button type="button" role="radio" data-p="afternoon">Afternoon</button><button type="button" role="radio" data-p="evening">Evening</button></div></div>

 <div class="top">
  <span class="when" id="when"></span>
  <span class="pts" id="pts"></span>
  <button type="button" class="menu" id="menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
 </div>

 <header class="hd"><h1 id="h1"></h1><p id="hsub"></p></header>

 <section id="reflect" aria-labelledby="rfH" hidden>
  <div class="sh"><h2 id="rfH">Night check-in</h2><span class="note" id="rfT">8:30</span></div>
  <div id="rfBox"></div>
 </section>

 <section class="sec" id="planSec" aria-labelledby="planH">
  <div class="sh"><h2 id="planH">My plan</h2><span class="ed" id="planEd"></span></div>
  <div class="card plan">
   <div class="ph" id="startRow"></div>
   <ol class="rows" id="rows"></ol>
   <form class="add" id="addF" action="#"><label class="sr" for="addT">New block</label><input id="addT" maxlength="40" placeholder="Add a block" autocomplete="off">
    <label class="sr" for="addM">Minutes</label><select id="addM"><option>10</option><option>15</option><option selected>20</option><option>30</option><option>45</option><option>60</option></select>
    <button type="submit" class="btn pri sm" style="min-height:38px">Add</button></form>
   <div class="pf"><div><div class="lbl">Coach review</div><div class="sub" id="rvSub"></div></div><button type="button" class="sw" id="rvSw" role="switch" aria-checked="true" aria-label="Coach review"></button></div>
  </div>
 </section>

 <section class="sec" aria-labelledby="skH">
  <div class="sh"><h2 id="skH">Skills</h2><span class="note">This month</span></div>
  <div class="card sk" id="skills"></div>
 </section>

 <section class="sec" aria-labelledby="ciH">
  <div class="sh"><h2 id="ciH">Check-ins</h2><span class="tag n" id="ciTag"></span></div>
  <div class="card ci" id="checkins"></div>
 </section>

 <section class="sec" aria-label="Coach">
  <div class="card cr"><span class="mark" id="av1"></span><div><b>Coach Juno</b><span>(512) 555-0147</span></div>
   <button type="button" class="btn sm" id="bCall"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>Talk</button>
   <button type="button" class="btn sm" id="bText"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Text</button></div>
 </section>

 <section class="sec" aria-labelledby="rwH">
  <h2 class="sr" id="rwH">Reward</h2>
  <div class="reward card" style="margin-top:0"><span class="ri"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></span>
   <div class="rb"><b>10:30 bedtime on Fridays</b><span id="rwT"></span><div class="bar" aria-hidden="true"><i id="rwB"></i></div></div></div>
 </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet call-s" id="callS" role="dialog" aria-modal="true" aria-labelledby="callH" hidden>
 <div class="ring" id="av2"></div>
 <h3 id="callH">Coach Juno</h3>
 <p class="st" id="callSt">Calling…</p>
 <div class="caps" id="caps" aria-live="polite"></div>
 <div class="ctl"><button type="button" class="end" id="endCall"><span class="cb"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-3 0-5.8.8-8.3 2.3a1 1 0 0 0-.4 1.2l1 2.4a1 1 0 0 0 1.2.6l3-1a1 1 0 0 0 .7-.9V12a12 12 0 0 1 5.6 0v1.6a1 1 0 0 0 .7.9l3 1a1 1 0 0 0 1.2-.6l1-2.4a1 1 0 0 0-.4-1.2A15.6 15.6 0 0 0 12 9Z"/></svg></span>End</button></div>
</section>
<section class="sheet text-s" id="textS" role="dialog" aria-modal="true" aria-labelledby="textH" hidden>
 <div class="tsh"><span class="mark" id="av3"></span><div><b id="textH">Coach Juno</b><span>(512) 555-0147</span></div>
  <button type="button" class="x" id="closeText" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="tth" id="tth" aria-live="polite"></div>
 <form class="tin" id="tform" action="#"><label class="sr" for="tinput">Message</label><input id="tinput" autocomplete="off" maxlength="300" placeholder="Message"><button type="submit" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg></button></form>
</section>
<div class="toast" id="toast" role="status"></div>
<script src="../shared/drawer.js"></script>
<script src="app.js"></script>
</body>
</html>
